name: CI

on:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - "feat/**"
      - "fix/**"
      - "test/**"
      - "refactor/**"
      - "perf/**"
      - "build/**"
      - "ci/**"
      - "style/**"
      - "chore/**"
      - "revert/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.head.repo.full_name || github.repository }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

env:
  RUST_NIGHTLY_TOOLCHAIN: nightly-2026-05-18

jobs:
  release-quality:
    name: Rust, Swift, MLX, and App Bundle
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Checkout immutable IronMLX commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout identity
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=normal)"

      - name: Verify Conventional Commits
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
        run: |
          set -euo pipefail
          case "$GITHUB_EVENT_NAME" in
            pull_request)
              base_sha="${PR_BASE_SHA:?missing pull request base SHA}"
              head_sha="${PR_HEAD_SHA:?missing pull request head SHA}"
              ;;
            push)
              base_sha="${PUSH_BEFORE_SHA:?missing push before SHA}"
              head_sha="$GITHUB_SHA"
              ;;
            *)
              echo "error: unsupported CI event: $GITHUB_EVENT_NAME" >&2
              exit 1
              ;;
          esac
          scripts/verify-conventional-commits.sh "$base_sha" "$head_sha"

      - name: Install pinned Rust toolchains
        shell: bash
        run: |
          set -euo pipefail
          rustup toolchain install 1.94.0 --profile minimal --component clippy,rustfmt
          rustup toolchain install "$RUST_NIGHTLY_TOOLCHAIN" --profile minimal --component clippy,rustfmt
          rustc --version --verbose
          rustc "+$RUST_NIGHTLY_TOOLCHAIN" --version --verbose

      - name: Verify product version and publication boundary
        shell: bash
        run: scripts/verify-version-consistency.sh

      - name: Verify deterministic CycloneDX SBOM
        shell: bash
        run: scripts/verify-sbom.sh

      - name: Install pinned Rust dependency audit tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --version 0.22.2 cargo-audit
          test "$(cargo audit --version)" = "cargo-audit-audit 0.22.2"

      - name: Audit Rust dependencies for known vulnerabilities
        shell: bash
        run: cargo audit

      - name: Verify license policy and reproducible third-party materials
        shell: bash
        run: python3 scripts/verify-license-policy.py

      - name: Install pinned secret scanner
        shell: bash
        run: |
          set -euo pipefail
          scanner_dir="$RUNNER_TEMP/gitleaks-8.30.1"
          mkdir -p "$scanner_dir"
          archive="$scanner_dir/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_darwin_arm64.tar.gz" \
            --output "$archive"
          printf '%s  %s\n' \
            b40ab0ae55c505963e365f271a8d3846efbc170aa17f2607f13df610a9aeb6a5 \
            "$archive" | shasum --algorithm 256 --check
          tar -xzf "$archive" -C "$scanner_dir"
          test "$("$scanner_dir/gitleaks" version)" = "8.30.1"
          echo "GITLEAKS_BIN=$scanner_dir/gitleaks" >> "$GITHUB_ENV"

      - name: Scan tracked source tree for secrets
        shell: bash
        run: scripts/verify-secrets.sh

      - name: Install pinned license inventory tool
        shell: bash
        run: |
          set -euo pipefail
          cargo install --locked --features cli --version 0.9.1 cargo-about
          test "$(cargo-about --version)" = "cargo-about 0.9.1"

      - name: Checkout clean immutable MLX source
        shell: bash
        run: scripts/checkout-release-mlx.sh "$RUNNER_TEMP/ironmlx-mlx-source"

      - name: Build self-contained Release App Bundle
        shell: bash
        env:
          MLX_SRC: ${{ runner.temp }}/ironmlx-mlx-source
        run: scripts/build-app-bundle.sh

      - name: Verify reproducible third-party materials
        shell: bash
        env:
          MLX_SRC: ${{ runner.temp }}/ironmlx-mlx-source
          MLX_BUILD_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-build
        run: scripts/verify-third-party-materials.sh

      - name: Run required Rust gates
        shell: bash
        env:
          MLX_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-install
          MLX_METAL_PATH: ${{ github.workspace }}/.build/app-bundle/mlx-install/lib
        run: |
          set -euo pipefail
          cargo fmt --all -- --check
          cargo "+$RUST_NIGHTLY_TOOLCHAIN" fmt --all -- --check
          cargo "+$RUST_NIGHTLY_TOOLCHAIN" clippy --locked --all-features --workspace -- -D warnings
          cargo build --locked --release

      - name: Run public API contract tests
        shell: bash
        env:
          MLX_DIR: ${{ github.workspace }}/.build/app-bundle/mlx-install
          MLX_METAL_PATH: ${{ github.workspace }}/.build/app-bundle/mlx-install/lib
        run: |
          set -euo pipefail
          test -f "$MLX_DIR/lib/mlx.metallib"
          metallib_paths=(
            "$GITHUB_WORKSPACE/mlx-sys/mlx.metallib"
            "$GITHUB_WORKSPACE/ironmlx/mlx.metallib"
            "$GITHUB_WORKSPACE/mlx/mlx.metallib"
            "$GITHUB_WORKSPACE/ironmlx-bench-kernel/mlx.metallib"
            "$GITHUB_WORKSPACE/turboquant/mlx.metallib"
          )
          cleanup_metallib() {
            for path in "${metallib_paths[@]}"; do
              rm -f "$path"
            done
          }
          trap cleanup_metallib EXIT
          for path in "${metallib_paths[@]}"; do
            cp "$MLX_DIR/lib/mlx.metallib" "$path"
          done
          cargo test --locked --all-features --workspace -- --test-threads=1
          cargo test --locked --all-features \
            --manifest-path "$GITHUB_WORKSPACE/Cargo.toml" \
            -p ironmlx --lib core::server::

      - name: Run pinned official SDK contract tests
        shell: bash
        run: |
          set -euo pipefail
          contract_venv="$RUNNER_TEMP/ironmlx-api-contract-sdk"
          python3 -m venv "$contract_venv"
          "$contract_venv/bin/python" -m pip install \
            --disable-pip-version-check \
            --requirement scripts/api-contract-sdk/requirements.txt
          "$contract_venv/bin/python" \
            scripts/api-contract-sdk/contract.py \
            --fixture

      - name: Run Swift Release tests
        shell: bash
        run: |
          set -euo pipefail
          swift test \
            --package-path ironmlx-app \
            --configuration release \
            --scratch-path .build/ci-swift \
            --no-parallel

      - name: Re-run static Bundle gate and protect tracked sources
        shell: bash
        run: |
          set -euo pipefail
          scripts/verify-app-bundle.sh dist/IronMLX.app
          scripts/verify-model-distribution-boundary.sh dist/IronMLX.app
          git diff --check
          git diff --exit-code
          test -z "$(git status --porcelain=v1 --untracked-files=no)"
